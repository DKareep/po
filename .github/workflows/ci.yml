name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run knip
        run: npm run knip

      - name: Generate knip report
        if: always()
        run: npx knip --reporter json > knip-report.json || true

      - name: Upload knip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-report.json
          retention-days: 14

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          # `LocationSelector`, `LiveFleetMap`, and the driver `MapPage` call
          # `new mapboxgl.Map()` on mount, which throws synchronously if
          # `mapboxgl.accessToken` is empty - crashing the surrounding
          # ErrorBoundary and wiping out whatever UI the test expects to find.
          # Tests block all real Mapbox network calls via `mockMapbox()`
          # (tests/support/mapbox.ts), so this never needs to be a live,
          # authorized token - just non-empty. Hardcoded rather than sourced
          # from a repo secret so there's nothing to misconfigure in GitHub
          # (wrong tab, wrong scope, name mismatch, etc.) for a value that
          # was never sensitive to begin with.
          VITE_MAPBOX_TOKEN: 'pk.eyJ1IjoiZGlqaW5rcyIsImEiOiJjbXJzbTY0ZWg0ank3MnlzZGlrY3J1ejRiIn0.wUY2Hhw4Mpr3l3nHnqJjZQ'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-reports:
    name: Publish reports to GitHub Pages
    needs: [unit-tests, e2e-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage
          path: site/coverage

      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/e2e

      - name: Build landing page
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>po - test reports</title>
          </head>
          <body>
            <h1>po - test reports</h1>
            <ul>
              <li><a href="coverage/lcov-report/index.html">Unit test coverage</a></li>
              <li><a href="e2e/index.html">Playwright e2e report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
